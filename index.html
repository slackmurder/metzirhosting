<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Third Person Clown Horror</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: black;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ccc;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 30px;
            border-left: 5px solid #a00;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(5px);
            font-weight: 500;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        #stamina-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 200px;
            height: 18px;
            background: rgba(20, 20, 20, 0.8);
            border-radius: 20px;
            border: 2px solid #3a3a3a;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        #stamina-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #c0392b, #e67e22);
            border-radius: 20px;
            transition: width 0.05s linear;
        }
        #key-indicator {
            position: absolute;
            top: 30px;
            right: 30px;
            color: #ffd966;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            border: 1px solid #ffd966;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            z-index: 100;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 60px;
            border-radius: 20px;
            font-size: 2rem;
            font-weight: bold;
            border: 2px solid #a00;
            z-index: 200;
            display: none;
            text-align: center;
            box-shadow: 0 0 50px #a00;
            backdrop-filter: blur(8px);
            letter-spacing: 2px;
        }
        #gameover span {
            display: block;
            font-size: 1rem;
            margin-top: 15px;
            color: #ccc;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div id="info">FIND THE KEY - SHIFT TO RUN</div>
    <div id="stamina-container">
        <div id="stamina-bar" style="width: 100%;"></div>
    </div>
    <div id="key-indicator">KEY: NO</div>
    <div id="gameover">GAME OVER<span>Press R to restart</span></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 15, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xaaccff, 0.6);
        dirLight.position.set(10, 20, 5);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 30;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 50;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0x4466aa, 0.3);
        fillLight.position.set(0, 5, 0);
        scene.add(fillLight);

        const mapSize = 30;
        const groundGeo = new THREE.BoxGeometry(mapSize, 0.5, mapSize);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.8, metalness: 0.2 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.receiveShadow = true;
        ground.position.y = -0.25;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(mapSize, 20, 0x88aaff, 0x334466);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const wallHeight = 2.5;
        const wallThickness = 0.5;
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x6a4a7a, emissive: 0x1a0a1a, roughness: 0.6 });

        const walls = [
            { pos: [0, wallHeight/2, -mapSize/2], size: [mapSize, wallHeight, wallThickness] },
            { pos: [0, wallHeight/2, mapSize/2], size: [mapSize, wallHeight, wallThickness] },
            { pos: [-mapSize/2, wallHeight/2, 0], size: [wallThickness, wallHeight, mapSize] },
            { pos: [mapSize/2, wallHeight/2, 0], size: [wallThickness, wallHeight, mapSize] }
        ];

        walls.forEach(w => {
            const geo = new THREE.BoxGeometry(...w.size);
            const mesh = new THREE.Mesh(geo, wallMat);
            mesh.position.set(...w.pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
        });

        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x4a3a5a, roughness: 0.9 });
        const pillarPositions = [
            [-8, 0, -8], [8, 0, -8], [-8, 0, 8], [8, 0, 8],
            [0, 0, -12], [0, 0, 12], [-12, 0, 0], [12, 0, 0],
            [-5, 0, 5], [5, 0, -5], [-5, 0, -5], [5, 0, 5]
        ];
        pillarPositions.forEach(pos => {
            const geo = new THREE.CylinderGeometry(0.8, 0.8, 3, 8);
            const pillar = new THREE.Mesh(geo, pillarMat);
            pillar.position.set(pos[0], 1.5, pos[1]);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        });

        const characterGroup = new THREE.Group();

        const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.4, 12);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3a6ea5, roughness: 0.4, metalness: 0.1 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        body.receiveShadow = true;
        body.position.y = 0.7;
        characterGroup.add(body);

        const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffddbb, roughness: 0.3 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.castShadow = true;
        head.receiveShadow = true;
        head.position.y = 1.7;
        characterGroup.add(head);

        const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.2, 1.8, 0.45);
        characterGroup.add(leftEye);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.2, 1.8, 0.45);
        characterGroup.add(rightEye);

        const packGeo = new THREE.BoxGeometry(0.6, 0.6, 0.3);
        const packMat = new THREE.MeshStandardMaterial({ color: 0x2a4a6a });
        const pack = new THREE.Mesh(packGeo, packMat);
        pack.position.set(0, 0.9, -0.6);
        pack.castShadow = true;
        pack.receiveShadow = true;
        characterGroup.add(pack);

        characterGroup.position.set(0, 0, 0);
        scene.add(characterGroup);

        const clownGroup = new THREE.Group();

        const cBodyGeo = new THREE.CylinderGeometry(0.9, 0.9, 2.0, 8);
        const cBodyMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, emissive: 0x331111, roughness: 0.5 });
        const cBody = new THREE.Mesh(cBodyGeo, cBodyMat);
        cBody.castShadow = true;
        cBody.receiveShadow = true;
        cBody.position.y = 1.0;
        clownGroup.add(cBody);

        const cHeadGeo = new THREE.SphereGeometry(0.9, 16, 16);
        const cHeadMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x220000 });
        const cHead = new THREE.Mesh(cHeadGeo, cHeadMat);
        cHead.castShadow = true;
        cHead.receiveShadow = true;
        cHead.position.y = 2.2;
        clownGroup.add(cHead);

        const noseGeo = new THREE.SphereGeometry(0.2, 8, 8);
        const noseMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x440000 });
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.set(0, 2.2, 0.9);
        nose.castShadow = true;
        clownGroup.add(nose);

        const cEyeGeo = new THREE.SphereGeometry(0.18, 8, 8);
        const cEyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const cLeftEye = new THREE.Mesh(cEyeGeo, cEyeMat);
        cLeftEye.position.set(-0.35, 2.4, 0.8);
        clownGroup.add(cLeftEye);
        const cRightEye = new THREE.Mesh(cEyeGeo, cEyeMat);
        cRightEye.position.set(0.35, 2.4, 0.8);
        clownGroup.add(cRightEye);

        const smileMat = new THREE.MeshStandardMaterial({ color: 0xaa0000 });
        for (let i = 0; i < 5; i++) {
            const tooth = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6), smileMat);
            tooth.position.set(-0.4 + i*0.2, 1.9, 0.85);
            clownGroup.add(tooth);
        }

        const hatGeo = new THREE.ConeGeometry(0.6, 0.8, 8);
        const hatMat = new THREE.MeshStandardMaterial({ color: 0xaa2222 });
        const hat = new THREE.Mesh(hatGeo, hatMat);
        hat.position.y = 3.0;
        hat.castShadow = true;
        clownGroup.add(hat);
        const hatBall = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), new THREE.MeshStandardMaterial({ color: 0xffaa00 }));
        hatBall.position.y = 3.5;
        clownGroup.add(hatBall);

        clownGroup.position.set(10, 0, 10);
        clownGroup.castShadow = true;
        clownGroup.receiveShadow = true;
        scene.add(clownGroup);

        const keyGroup = new THREE.Group();
        const keyMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x553300 });
        const keyStem = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.1), keyMat);
        keyStem.position.y = 0.4;
        keyStem.castShadow = true;
        keyGroup.add(keyStem);
        const keyHead = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.1, 8, 12), keyMat);
        keyHead.rotation.x = Math.PI / 2;
        keyHead.position.y = 0.9;
        keyHead.castShadow = true;
        keyGroup.add(keyHead);
        const keyTeeth = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), keyMat);
        keyTeeth.position.set(0, 0.15, 0.15);
        keyTeeth.castShadow = true;
        keyGroup.add(keyTeeth);

        keyGroup.position.set(-10, 0, -10);
        keyGroup.scale.set(0.8, 0.8, 0.8);
        scene.add(keyGroup);

        const keyLight = new THREE.PointLight(0xffaa00, 0.8, 5);
        keyLight.position.set(-10, 1, -10);
        scene.add(keyLight);

        const player = {
            pos: new THREE.Vector3(0, 0, 0),
            speed: 5.0,
            runSpeed: 9.0,
            stamina: 100,
            maxStamina: 100,
            hasKey: false
        };

        let clown = {
            pos: new THREE.Vector3(10, 0, 10),
            speed: 2.8
        };

        let gameOver = false;

        const keys = {
            w: false, a: false, s: false, d: false, shift: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                if (gameOver) restartGame();
            }
            switch(e.code) {
                case 'KeyW': keys.w = true; e.preventDefault(); break;
                case 'KeyA': keys.a = true; e.preventDefault(); break;
                case 'KeyS': keys.s = true; e.preventDefault(); break;
                case 'KeyD': keys.d = true; e.preventDefault(); break;
                case 'ShiftLeft':
                case 'ShiftRight': keys.shift = true; e.preventDefault(); break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = false; e.preventDefault(); break;
                case 'KeyA': keys.a = false; e.preventDefault(); break;
                case 'KeyS': keys.s = false; e.preventDefault(); break;
                case 'KeyD': keys.d = false; e.preventDefault(); break;
                case 'ShiftLeft':
                case 'ShiftRight': keys.shift = false; e.preventDefault(); break;
            }
        });

        function restartGame() {
            gameOver = false;
            document.getElementById('gameover').style.display = 'none';
            document.getElementById('gameover').innerHTML = 'GAME OVER<span>Press R to restart</span>';
            document.getElementById('gameover').style.borderColor = '#a00';
            document.getElementById('gameover').style.boxShadow = '0 0 50px #a00';

            player.pos.set(0, 0, 0);
            player.stamina = 100;
            player.hasKey = false;
            characterGroup.position.set(0, 0, 0);

            clown.pos.set(10, 0, 10);
            clownGroup.position.set(10, 0, 10);

            keyGroup.position.set(-10, 0, -10);
            keyGroup.visible = true;
            keyLight.visible = true;

            document.getElementById('key-indicator').textContent = 'KEY: NO';
            document.getElementById('key-indicator').style.color = '#ffd966';
            document.getElementById('key-indicator').style.borderColor = '#ffd966';

            camera.position.set(0, 8, 12);
        }

        const boundary = mapSize/2 - 1.2;
        const pillarRadius = 1.2;
        const pillarPositionsArray = pillarPositions.map(p => new THREE.Vector2(p[0], p[1]));

        function constrainPosition(pos) {
            pos.x = Math.max(-boundary, Math.min(boundary, pos.x));
            pos.z = Math.max(-boundary, Math.min(boundary, pos.z));

            for (let p of pillarPositionsArray) {
                const dx = pos.x - p.x;
                const dz = pos.z - p.y;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < pillarRadius) {
                    const angle = Math.atan2(dz, dx);
                    pos.x = p.x + Math.cos(angle) * pillarRadius;
                    pos.z = p.y + Math.sin(angle) * pillarRadius;
                }
            }
        }

        let clock = new THREE.Clock();

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.1);

            if (!gameOver) {
                const moveDir = new THREE.Vector3(0, 0, 0);
                if (keys.w) moveDir.z -= 1;
                if (keys.s) moveDir.z += 1;
                if (keys.a) moveDir.x -= 1;
                if (keys.d) moveDir.x += 1;

                if (moveDir.length() > 0) {
                    moveDir.normalize();

                    let currentSpeed = player.speed;
                    if (keys.shift && player.stamina > 0) {
                        currentSpeed = player.runSpeed;
                        player.stamina = Math.max(0, player.stamina - 28 * delta);
                    } else {
                        player.stamina = Math.min(player.maxStamina, player.stamina + 18 * delta);
                    }

                    player.pos.x += moveDir.x * currentSpeed * delta;
                    player.pos.z += moveDir.z * currentSpeed * delta;

                    constrainPosition(player.pos);

                    const angle = Math.atan2(moveDir.x, moveDir.z);
                    characterGroup.rotation.y = angle;
                } else {
                    player.stamina = Math.min(player.maxStamina, player.stamina + 12 * delta);
                }

                characterGroup.position.copy(player.pos);

                document.getElementById('stamina-bar').style.width = (player.stamina / player.maxStamina * 100) + '%';

                if (!player.hasKey) {
                    const distToKey = player.pos.distanceTo(keyGroup.position);
                    if (distToKey < 1.8) {
                        player.hasKey = true;
                        keyGroup.visible = false;
                        keyLight.visible = false;
                        document.getElementById('key-indicator').textContent = 'KEY: YES';
                        document.getElementById('key-indicator').style.color = '#ffaa00';
                        document.getElementById('key-indicator').style.borderColor = '#ffaa00';
                    }
                }

                const toPlayer = new THREE.Vector3().subVectors(player.pos, clown.pos);
                const distToPlayer = toPlayer.length();

                if (distToPlayer > 0.5) {
                    toPlayer.normalize();
                    const wobble = Math.sin(Date.now() * 0.005) * 0.2;
                    const perp = new THREE.Vector3(-toPlayer.z, 0, toPlayer.x).multiplyScalar(wobble);
                    const moveVec = toPlayer.clone().add(perp).normalize();

                    const clownSpeed = clown.speed * (player.hasKey ? 1.4 : 1.0);
                    clown.pos.x += moveVec.x * clownSpeed * delta;
                    clown.pos.z += moveVec.z * clownSpeed * delta;

                    clown.pos.x = Math.max(-boundary-0.5, Math.min(boundary+0.5, clown.pos.x));
                    clown.pos.z = Math.max(-boundary-0.5, Math.min(boundary+0.5, clown.pos.z));

                    const clownAngle = Math.atan2(toPlayer.x, toPlayer.z);
                    clownGroup.rotation.y = clownAngle;
                }

                clownGroup.position.copy(clown.pos);

                const catchDist = player.pos.distanceTo(clown.pos);
                if (catchDist < 1.8) {
                    gameOver = true;
                    document.getElementById('gameover').style.display = 'block';
                }

                if (player.hasKey && !gameOver) {
                    const nearBorder = Math.abs(player.pos.x) > boundary - 1.2 || Math.abs(player.pos.z) > boundary - 1.2;
                    if (nearBorder) {
                        gameOver = true;
                        document.getElementById('gameover').innerHTML = 'YOU ESCAPED<span>Press R to restart</span>';
                        document.getElementById('gameover').style.borderColor = '#00aa00';
                        document.getElementById('gameover').style.boxShadow = '0 0 50px #00aa00';
                        document.getElementById('gameover').style.display = 'block';
                    }
                }
            }

            const targetCamPos = new THREE.Vector3(
                player.pos.x,
                player.pos.y + 8,
                player.pos.z + 12
            );
            camera.position.lerp(targetCamPos, 0.08);
            camera.lookAt(player.pos.x, player.pos.y + 1.5, player.pos.z);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

        document.getElementById('gameover').style.display = 'none';
    </script>
</body>
</html>
